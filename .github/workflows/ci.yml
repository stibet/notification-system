name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start
        run: docker compose up -d --build
      - name: Health check
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors localhost:8000/api/health
      - name: Send a notification
        run: |
          id=$(curl --fail -s -X POST localhost:8000/api/notifications -H "Content-Type: application/json" \
            -d '{"channel":"sms","recipient":"+905551234567","content":"Hello from CI"}' | jq -r .data.id)
          for i in $(seq 1 30); do
            status=$(curl -s localhost:8000/api/notifications/$id | jq -r .data.status)
            echo "$status"
            if [ "$status" = sent ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Three workers with a duplicate job for every notification
        run: |
          jq -n '{notifications: [range(300) | {channel: "sms", recipient: "+90555\(1000000 + .)", content: "Batch \(.)"}]}' > batch.json
          batch=$(curl --fail -s -X POST localhost:8000/api/batches -H "Content-Type: application/json" -d @batch.json | jq -r .data.batch_id)
          docker compose exec -T app php artisan tinker --execute="App\Models\Notification::where('batch_id', '$batch')->each(fn (\$n) => App\Jobs\SendNotification::dispatch(\$n->id, 'sms')->onQueue('normal'));"
          for i in $(seq 1 60); do
            sent=$(curl -s localhost:8000/api/batches/$batch | jq '.data.status_counts.sent // 0')
            echo "sent: $sent"
            if [ "$sent" = 300 ]; then break; fi
            sleep 1
          done
          sleep 2
          # each notification must reach the provider once
          docker compose logs worker | grep '"Notification sent"' | grep -o '"notification_id":"[^"]*"' | sort > sent.txt
          echo "sent log lines: $(wc -l < sent.txt), sent twice: $(uniq -d sent.txt | wc -l)"
          [ "$sent" = 300 ] && [ "$(uniq sent.txt | wc -l)" -ge 300 ] && [ -z "$(uniq -d sent.txt)" ]
      - name: Tests
        run: docker compose run --rm app php artisan test
      - name: Logs
        if: failure()
        run: docker compose logs
