services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.docker
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env.docker
    command: php artisan queue:work --queue=high,normal,low
    restart: unless-stopped
    deploy:
      replicas: 3
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build: .
    env_file: .env.docker
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
