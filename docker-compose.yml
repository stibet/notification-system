services:
  app:
    build: .
    image: notification-service
    ports:
      - "8000:8000"
    env_file: .env.docker
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: notification-service
    env_file: .env.docker
    command: php artisan queue:work --queue=high,normal,low
    restart: unless-stopped
    deploy:
      replicas: 3
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  postgres-data:
